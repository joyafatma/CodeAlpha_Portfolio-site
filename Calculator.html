<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('img2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .calculator {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 400px;
        }

        .display {
            display: flex;
            flex-direction: column;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            margin-bottom: 25px;
            grid-column: span 4;
            height: 120px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .expression {
            color: rgba(0, 0, 0, 0.6);
            font-size: 1.4rem;
            text-align: right;
            height: 40%;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 0 15px 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result {
            color: #000;
            font-size: 2.8rem;
            text-align: right;
            height: 60%;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 0 15px 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button {
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 10px;
            padding: 20px;
            font-size: 1.6rem;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.2s ease;
        }

        button:hover::before {
            transform: scaleX(1);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .number {
            background-color: rgba(220, 220, 220, 0.9);
        }

        .operator {
            background-color: #ff9500;
            color: white;
        }

        .operator:hover {
            background-color: #ff8f00;
            color: white;
        }

        .equals {
            background-color: #ff2d55;
            color: white;
            grid-column: span 2;
        }

        .equals:hover {
            background-color: #ff1a45;
            color: white;
        }

        .clear {
            background-color: #ff2d55;
            color: white;
            grid-column: span 2;
        }

        .clear:hover {
            background-color: #ff1a45;
            color: white;
        }

        .delete {
            background-color: #ff9500;
            color: white;
        }

        .delete:hover {
            background-color: #ff8f00;
            color: white;
        }

        /* Key press animation */
        @keyframes keyPress {
            0% {
                transform: scale(1);
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            }
            50% {
                transform: scale(0.95);
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            }
        }

        button.pressed {
            animation: keyPress 0.2s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression"></div>
            <div class="result">0</div>
        </div>
        <button class="clear">AC</button>
        <button class="delete">DEL</button>
        <button class="operator">÷</button>
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator">×</button>
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operator">−</button>
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operator">+</button>
        <button class="number">0</button>
        <button class="number">.</button>
        <button class="equals">=</button>
    </div>

    <script>
        class Calculator {
            constructor(expressionElement, resultElement) {
                this.expressionElement = expressionElement;
                this.resultElement = resultElement;
                this.clear();
                this.addKeyPressHighlight();
            }

            addKeyPressHighlight() {
                // Add click event listeners for visual feedback
                document.querySelectorAll('button').forEach(button => {
                    button.addEventListener('mousedown', () => {
                        button.classList.add('pressed');
                    });
                    button.addEventListener('mouseup', () => {
                        button.classList.remove('pressed');
                    });
                    button.addEventListener('mouseleave', () => {
                        button.classList.remove('pressed');
                    });
                });

                // Add keyboard event listeners for visual feedback
                window.addEventListener('keydown', (e) => {
                    if (e.key >= '0' && e.key <= '9' || e.key === '.') {
                        const button = document.querySelector(`button:contains('${e.key}')`);
                        if (button) button.classList.add('pressed');
                    } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                        const button = document.querySelector(`button:contains('${e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key}')`);
                        if (button) button.classList.add('pressed');
                    } else if (e.key === 'Enter' || e.key === '=') {
                        const equalsButton = document.querySelector('.equals');
                        if (equalsButton) equalsButton.classList.add('pressed');
                    } else if (e.key === 'Backspace' || e.key === 'Delete') {
                        const deleteButton = document.querySelector('.delete');
                        if (deleteButton) deleteButton.classList.add('pressed');
                    } else if (e.key === 'Escape') {
                        const clearButton = document.querySelector('.clear');
                        if (clearButton) clearButton.classList.add('pressed');
                    }
                });

                window.addEventListener('keyup', () => {
                    document.querySelectorAll('button').forEach(button => {
                        button.classList.remove('pressed');
                    });
                });
            }

            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.updateDisplay();
            }

            delete() {
                if (this.currentOperand === '0') return;
                this.currentOperand = this.currentOperand.toString().slice(0, -1);
                if (this.currentOperand === '') this.currentOperand = '0';
                this.updateDisplay();
            }

            appendNumber(number) {
                if (number === '.' && this.currentOperand.includes('.')) return;
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else {
                    this.currentOperand = this.currentOperand.toString() + number.toString();
                }
                this.updateDisplay();
            }

            chooseOperation(operation) {
                if (this.currentOperand === '0') return;
                if (this.previousOperand !== '') {
                    this.compute();
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '0';
                this.updateDisplay();
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '−':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        if (current === 0) {
                            alert('Cannot divide by zero!');
                            this.clear();
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }

                this.currentOperand = computation;
                this.operation = undefined;
                this.previousOperand = '';
                this.updateDisplay();
            }

            updateDisplay() {
                let expression = '';
                if (this.previousOperand !== '') {
                    expression += this.previousOperand;
                    if (this.operation) {
                        expression += ' ' + this.operation + ' ';
                    }
                }
                if (this.currentOperand !== '0' || !this.previousOperand) {
                    expression += this.currentOperand;
                }
                
                this.expressionElement.innerText = expression;
                this.resultElement.innerText = this.currentOperand;
            }
        }

        const calculator = new Calculator(
            document.querySelector('.expression'),
            document.querySelector('.result')
        );

        // Button event listeners
        document.querySelectorAll('.number').forEach(button => {
            button.addEventListener('click', () => {
                calculator.appendNumber(button.innerText);
            });
        });

        document.querySelectorAll('.operator').forEach(button => {
            button.addEventListener('click', () => {
                calculator.chooseOperation(button.innerText);
            });
        });

        document.querySelector('.equals').addEventListener('click', () => {
            calculator.compute();
        });

        document.querySelector('.delete').addEventListener('click', () => {
            calculator.delete();
        });

        document.querySelector('.clear').addEventListener('click', () => {
            calculator.clear();
        });

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9' || e.key === '.') {
                calculator.appendNumber(e.key);
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                calculator.chooseOperation(e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                calculator.compute();
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                calculator.delete();
            } else if (e.key === 'Escape') {
                calculator.clear();
            }
        });
    </script>
</body>
</html>
