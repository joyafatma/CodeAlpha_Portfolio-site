<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            line-height: 1.6;
        }

        /* Gallery Container */
        .gallery-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Category Filters */
        .category-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 25px;
            background-color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: #007bff;
            color: white;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        /* Gallery Item */
        .gallery-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        /* Zoom Overlay */
        .zoom-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .zoom-overlay.active {
            display: flex;
        }

        .zoom-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        /* Navigation Buttons */
        .zoom-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
            transition: background 0.3s ease;
        }

        .zoom-nav:hover {
            background: rgba(0,0,0,0.7);
        }

        .zoom-prev {
            left: 20px;
        }

        .zoom-next {
            right: 20px;
        }

        /* Close Button */
        .zoom-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
        }

        .zoom-close:hover {
            background: rgba(0,0,0,0.7);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            
            .filter-btn {
                padding: 0.3rem 0.8rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .filter-btn {
                padding: 0.2rem 0.6rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="category-filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="toy">Toys</button>
            <button class="filter-btn" data-category="car">Cars</button>
            <button class="filter-btn" data-category="flower">Flowers</button>
            <button class="filter-btn" data-category="dog">Dogs</button>
            <button class="filter-btn" data-category="street">Streets</button>
            <button class="filter-btn" data-category="river">Rivers</button>
        </div>
        
        <div class="gallery-grid">
            <!-- Toys -->
            <div class="gallery-item toy" data-category="toy">
                <img src="toy1.jpg" alt="Toy 1">
            </div>
            <div class="gallery-item toy" data-category="toy">
                <img src="toy2.jpg" alt="Toy 2">
            </div>
            <div class="gallery-item toy" data-category="toy">
                <img src="toy3.jpg" alt="Toy 3">
            </div>
            <div class="gallery-item toy" data-category="toy">
                <img src="toy4.webp" alt="Toy 4">
            </div>
            <div class="gallery-item toy" data-category="toy">
                <img src="toy5.jpg" alt="Toy 5">
            </div>
            <div class="gallery-item toy" data-category="toy">
                <img src="toy6.avif" alt="Toy 6">
            </div>

            <!-- Cars -->
            <div class="gallery-item car" data-category="car">
                <img src="car1.jpg" alt="Car 1">
            </div>
            <div class="gallery-item car" data-category="car">
                <img src="car2.webp" alt="Car 2">
            </div>
            <div class="gallery-item car" data-category="car">
                <img src="car3.avif" alt="Car 3">
            </div>
            <div class="gallery-item car" data-category="car">
                <img src="car4.avif" alt="Car 4">
            </div>
            <div class="gallery-item car" data-category="car">
                <img src="car5.webp" alt="Car 5">
            </div>
            <div class="gallery-item car" data-category="car">
                <img src="car6.webp" alt="Car 6">
            </div>

            <!-- Flowers -->
            <div class="gallery-item flower" data-category="flower">
                <img src="flower1.avif" alt="Flower 1">
            </div>
            <div class="gallery-item flower" data-category="flower">
                <img src="flower2.jpeg" alt="Flower 2">
            </div>
            <div class="gallery-item flower" data-category="flower">
                <img src="flower3.webp" alt="Flower 3">
            </div>
            <div class="gallery-item flower" data-category="flower">
                <img src="flower5.jpg" alt="Flower 5">
            </div>
            <div class="gallery-item flower" data-category="flower">
                <img src="flower6.jpg" alt="Flower 6">
            </div>

            <!-- Dogs -->
            <div class="gallery-item dog" data-category="dog">
                <img src="dog1.avif" alt="Dog 1">
            </div>
            <div class="gallery-item dog" data-category="dog">
                <img src="dog2.jpg" alt="Dog 2">
            </div>
            <div class="gallery-item dog" data-category="dog">
                <img src="dog3.webp" alt="Dog 3">
            </div>
            <div class="gallery-item dog" data-category="dog">
                <img src="dog4.jpeg" alt="Dog 4">
            </div>
            <div class="gallery-item dog" data-category="dog">
                <img src="dog5.avif" alt="Dog 5">
            </div>
            <div class="gallery-item dog" data-category="dog">
                <img src="dog6.avif" alt="Dog 6">
            </div>

            <!-- Streets -->
            <div class="gallery-item street" data-category="street">
                <img src="street1.jpg" alt="Street 1">
            </div>
            <div class="gallery-item street" data-category="street">
                <img src="street2.jpeg" alt="Street 2">
            </div>
            <div class="gallery-item street" data-category="street">
                <img src="street3.jpg" alt="Street 3">
            </div>
            <div class="gallery-item street" data-category="street">
                <img src="street4.jpg" alt="Street 4">
            </div>
            <div class="gallery-item street" data-category="street">
                <img src="street5.webp" alt="Street 5">
            </div>
            <div class="gallery-item street" data-category="street">
                <img src="street6.jpg" alt="Street 6">
            </div>

            <!-- Rivers -->
            <div class="gallery-item river" data-category="river">
                <img src="river1.webp" alt="River 1">
            </div>
            <div class="gallery-item river" data-category="river">
                <img src="river2.jpg" alt="River 2">
            </div>
            <div class="gallery-item river" data-category="river">
                <img src="river4.jpg" alt="River 4">
            </div>
            <div class="gallery-item river" data-category="river">
                <img src="river5.webp" alt="River 5">
            </div>
            <div class="gallery-item river" data-category="river">
                <img src="river6.jpg" alt="River 6">
            </div>
        </div>
    </div>

    <!-- Zoom Overlay -->
    <div class="zoom-overlay">
        <span class="zoom-close">&times;</span>
        <span class="zoom-nav zoom-prev">&lt;</span>
        <span class="zoom-nav zoom-next">&gt;</span>
        <img src="" alt="" class="zoom-image">
    </div>

    <script>
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', () => {
            // Get all elements
            const galleryItems = document.querySelectorAll('.gallery-item');
            const filterButtons = document.querySelectorAll('.filter-btn');
            const zoomOverlay = document.querySelector('.zoom-overlay');
            const zoomImage = document.querySelector('.zoom-image');
            const zoomClose = document.querySelector('.zoom-close');
            const zoomPrev = document.querySelector('.zoom-prev');
            const zoomNext = document.querySelector('.zoom-next');

            // Store image sources for navigation
            const allImages = [...galleryItems].map(item => item.querySelector('img').src);
            let currentZoomIndex = 0;

            // Category Filtering
            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove active class from all buttons
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    const category = button.dataset.category;
                    galleryItems.forEach(item => {
                        if (category === 'all' || item.dataset.category === category) {
                            item.style.display = 'block';
                        } else {
                            item.style.display = 'none';
                        }
                    });
                });
            });

            // Image Click Handler
            galleryItems.forEach((item, index) => {
                const img = item.querySelector('img');
                
                item.addEventListener('click', (e) => {
                    // Prevent default action
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Show zoom overlay
                    zoomOverlay.classList.add('active');
                    // Set current image
                    currentZoomIndex = index;
                    zoomImage.src = img.src;
                    zoomImage.alt = img.alt;
                });
            });

            // Navigation Functions
            function showNextImage() {
                currentZoomIndex = (currentZoomIndex + 1) % allImages.length;
                zoomImage.src = allImages[currentZoomIndex];
            }

            function showPrevImage() {
                currentZoomIndex = (currentZoomIndex - 1 + allImages.length) % allImages.length;
                zoomImage.src = allImages[currentZoomIndex];
            }

            // Add navigation event listeners
            zoomPrev.addEventListener('click', showPrevImage);
            zoomNext.addEventListener('click', showNextImage);

            // Close Overlay
            [zoomClose, zoomOverlay].forEach(element => {
                element.addEventListener('click', (e) => {
                    if (e.target === zoomOverlay || e.target === zoomClose) {
                        zoomOverlay.classList.remove('active');
                    }
                });
            });

            // Keyboard Navigation
            document.addEventListener('keydown', (e) => {
                if (zoomOverlay.classList.contains('active')) {
                    e.preventDefault();
                    switch(e.key) {
                        case 'Escape':
                            zoomOverlay.classList.remove('active');
                            break;
                        case 'ArrowLeft':
                            showPrevImage();
                            break;
                        case 'ArrowRight':
                            showNextImage();
                            break;
                    }
                }
            });
        });
    </script>
</body>
</html>
